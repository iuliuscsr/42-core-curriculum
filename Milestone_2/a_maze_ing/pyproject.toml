[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen-42"
version = "1.0.0"
description = "A reusable maze generation module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.setuptools]
py-modules = ["mazegen"]