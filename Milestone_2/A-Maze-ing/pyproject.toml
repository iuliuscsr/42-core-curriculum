[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "A reusable maze generation module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["mazegen"]

[tool.mypy]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "mlx.*"
ignore_missing_imports = true